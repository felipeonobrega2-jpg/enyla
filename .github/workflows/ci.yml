# CI da main. Roda em todo pull request contra a main e em todo push na main.
# Gerenciador: npm (package-lock.json). Scripts reais do package.json:
#   lint  → eslint
#   test  → vitest run
#   build → vitest run && next build  (o build já inclui os testes; o passo de teste fica separado de propósito)
# Não há script de typecheck. O `next build` roda a checagem de TypeScript.
# O build não lê segredo nem variável de ambiente: o cliente do Supabase só é criado no primeiro uso.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        # A main já falha no ESLint por erros anteriores a este PR (dezenas de erros em telas e scripts).
        # Este passo roda e fica visível no log, mas não bloqueia o workflow. Não reescrevemos o app para isso.
        continue-on-error: true
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
