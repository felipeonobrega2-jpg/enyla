version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# ENYLA — Evolution API + Caddy (HTTPS automático)
#
# Arquitetura:
#   Internet ──→ Caddy :443 ──→ evolution:8080  (evo.enyla.com.br)
#   Evolution  ──→ Vercel webhook URL  (Next.js app no Supabase/Vercel)
#
# A porta 8080 NÃO é exposta publicamente — só 80/443 via Caddy.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Proxy reverso com HTTPS automático (Let's Encrypt) ──────────────────
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

  # ── Evolution API ────────────────────────────────────────────────────────
  #
  # Versão: 2.4.0-rc2 desde 01/11/2026 (a v2.3.7, última estável, já não sincronizava com o WhatsApp).
  #
  # ATENÇÃO — @lid: os PRs #2663 e #2673 (evolution-foundation/evolution-api)
  # que corrigem resolução de @lid estão ABERTOS (draft) e não foram mesclados
  # em nenhuma release até hoje. O v2.3.7 armazena o jid @lid como recebido;
  # a coluna `telefone` na tabela whatsapp_conversas serve de fallback manual
  # até a correção ser publicada numa release estável.
  # Monitore: https://github.com/EvolutionAPI/evolution-api/releases
  evolution:
    image: evoapicloud/evolution-api:2.4.0-rc2   # 01/11/2026: a v2.3.7 pareava mas não sincronizava (biblioteca do WhatsApp antiga)
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # NÃO exposto publicamente
    environment:
      # ── Identidade da instância ──────────────────────────────────────────
      SERVER_URL: https://evo.enyla.com.br
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVO_API_KEY}
      # Versão do WhatsApp Web que o Evolution informa ao parear. Desatualizada, o celular recusa com
      # "Não é possível conectar novos dispositivos". Atual em 01/11/2026; a lista fica em
      # github.com/wppconnect-team/wa-version (versions.json → currentVersion, sem o "-alpha").
      CONFIG_SESSION_PHONE_VERSION: "2.3000.1052612007"

      # ── Webhook global → Next.js no Vercel ──────────────────────────────
      # Token no query param pois o Evolution não suporta headers customizados
      # no webhook global configurado via variável de ambiente.
      WEBHOOK_GLOBAL_URL: ${NEXT_APP_URL}/api/whatsapp/webhook?token=${WHATSAPP_WEBHOOK_SECRET}
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"

      # Eventos habilitados — SOMENTE o necessário
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_MESSAGES_SET: "true"      # histórico na conexão inicial

      # Todos os outros desativados (evita ruído e custo de processamento)
      WEBHOOK_EVENTS_MESSAGES_UPDATE: "false"
      WEBHOOK_EVENTS_MESSAGES_DELETE: "false"
      WEBHOOK_EVENTS_SEND_MESSAGE: "false"
      WEBHOOK_EVENTS_CONTACTS_UPSERT: "false"
      WEBHOOK_EVENTS_CONTACTS_UPDATE: "false"
      WEBHOOK_EVENTS_PRESENCE_UPDATE: "false"
      WEBHOOK_EVENTS_CHATS_UPSERT: "false"
      WEBHOOK_EVENTS_CHATS_UPDATE: "false"
      WEBHOOK_EVENTS_CHATS_DELETE: "false"
      WEBHOOK_EVENTS_GROUPS_UPSERT: "false"
      WEBHOOK_EVENTS_GROUP_UPDATE: "false"
      WEBHOOK_EVENTS_GROUPS_PARTICIPANTS: "false"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "false"
      WEBHOOK_EVENTS_CALL: "false"
      WEBHOOK_EVENTS_NEW_JWT_TOKEN: "false"
      WEBHOOK_EVENTS_TYPEBOT_START: "false"
      WEBHOOK_EVENTS_TYPEBOT_CHANGE_STATUS: "false"
      WEBHOOK_EVENTS_ERRORS: "false"
      WEBHOOK_EVENTS_ERRORS_WEBHOOK: "false"

      # ── Banco próprio do Evolution (Postgres local) ──────────────────────
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evo:${POSTGRES_PASSWORD}@postgres:5432/evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "true"      # guarda histórico local no Postgres da VPS

      # ── Cache ────────────────────────────────────────────────────────────
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379
      CACHE_REDIS_PREFIX_KEY: "evolution"
      CACHE_REDIS_SAVE_INSTANCES: "false"

      # ── Sincronização de histórico na conexão ────────────────────────────
      # Faz o Evolution buscar o histórico completo disponível ao conectar.
      # O WhatsApp entrega automaticamente ~3 meses de conversas via Web;
      # mensagens mais antigas exigem sincronização pelo app do celular.
      CONFIG_SESSION_PHONE_CLIENT: "Enyla"
      CONFIG_SESSION_PHONE_NAME: "Chrome"

      # ── Segurança ────────────────────────────────────────────────────────
      DEL_INSTANCE: "false"       # impede que qualquer chamada delete instâncias
      LOG_LEVEL: ERROR            # reduz ruído de logs
      LOG_COLOR: "false"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - internal

  # ── Postgres (banco interno do Evolution — separado do Supabase) ─────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evo -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    networks:
      - internal

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
